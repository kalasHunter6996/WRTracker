name: Build WRTracker

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYERGLOBAL_HOME: /tmp/playerglobal
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download Apache Flex SDK
        run: |
          curl -L --fail --retry 3 \
            https://dlcdn.apache.org/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz \
            -o /tmp/flex.tar.gz
          mkdir -p /tmp/flex
          tar -xzf /tmp/flex.tar.gz -C /tmp/flex
          echo "FLEX_HOME=$(find /tmp/flex -maxdepth 1 -type d -name 'apache-flex-sdk-*' | head -n 1)" >> "$GITHUB_ENV"

      - name: Install Flash Player global 11.2
        run: |
          mkdir -p "$PLAYERGLOBAL_HOME/11.2"
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/nexussays/playerglobal/master/11.2/playerglobal.swc \
            -o "$PLAYERGLOBAL_HOME/11.2/playerglobal.swc"
          test -s "$PLAYERGLOBAL_HOME/11.2/playerglobal.swc"
          ls -lh "$PLAYERGLOBAL_HOME/11.2/playerglobal.swc"

      - name: Compile SWF
        run: |
          mkdir -p build
          "$FLEX_HOME/bin/mxmlc" \
            -target-player=11.2 \
            -source-path=as3/src \
            -output=build/kalas.wrtracker.WrTrackerView.swf \
            as3/src/wrtracker/WrTrackerView.as

      - name: Package MTMOD
        run: python3 tools/build_mtmod.py

      - name: Upload MTMOD
        uses: actions/upload-artifact@v4
        with:
          name: WRTracker-mtmod
          path: build/WRTracker-*.mtmod
