name: Build WRTracker

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYERGLOBAL_HOME: /tmp/playerglobal
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download Apache Flex SDK
        run: |
          curl -L --fail --retry 3 \
            https://dlcdn.apache.org/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz \
            -o /tmp/flex.tar.gz
          mkdir -p /tmp/flex
          tar -xzf /tmp/flex.tar.gz -C /tmp/flex
          echo "FLEX_HOME=$(find /tmp/flex -maxdepth 1 -type d -name 'apache-flex-sdk-*' | head -n 1)" >> "$GITHUB_ENV"

      - name: Install Flash Player global 11.2
        run: |
          mkdir -p "$PLAYERGLOBAL_HOME/11.2" "$PLAYERGLOBAL_HOME/27.0"
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/nexussays/playerglobal/master/11.2/playerglobal.swc \
            -o "$PLAYERGLOBAL_HOME/11.2/playerglobal.swc"
          test -s "$PLAYERGLOBAL_HOME/11.2/playerglobal.swc"
          # Flex 4.16.1's default config refers to 27.0. Use a real copy,
          # not a symlink, so the compiler can always open the expected file.
          cp "$PLAYERGLOBAL_HOME/11.2/playerglobal.swc" \
             "$PLAYERGLOBAL_HOME/27.0/playerglobal.swc"
          test -s "$PLAYERGLOBAL_HOME/27.0/playerglobal.swc"
          ls -l "$PLAYERGLOBAL_HOME/11.2/playerglobal.swc" "$PLAYERGLOBAL_HOME/27.0/playerglobal.swc"

      - name: Compile Python 2.7 modules to .pyc
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:2.7 \
            python -m compileall -q res/scripts/client/gui/mods
          find res/scripts/client/gui/mods -name '*.pyc' -print

      - name: Build external IView compile stub
        run: |
          mkdir -p build/stubs
          "$FLEX_HOME/bin/compc" \
            -source-path=as3/stubs \
            -include-classes net.wg.infrastructure.interfaces.IView \
            -output=build/stubs/wg-interfaces-stub.swc

      - name: Compile SWF
        run: |
          mkdir -p build
          "$FLEX_HOME/bin/mxmlc" \
            -target-player=11.2 \
            -source-path=as3/src \
            -external-library-path+=build/stubs/wg-interfaces-stub.swc \
            -output=build/kalas.wrtracker.WrTrackerView.swf \
            as3/src/wrtracker/WrTrackerView.as

      - name: Package MTMOD
        run: python3 tools/build_mtmod.py

      - name: Upload MTMOD
        uses: actions/upload-artifact@v4
        with:
          name: WRTracker-mtmod
          path: build/WRTracker-*.mtmod
